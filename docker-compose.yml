services:
  neo4j:
    build: .
    # Published on localhost only (Neo4j Browser and Bolt for development).
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
      - ./import:/import:ro

  # The only service that knows the superuser password.
  init:
    image: neo4j:2026.07.1-enterprise
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_APP_USER: ${NEO4J_APP_USER:-app}
      NEO4J_APP_PASSWORD: ${NEO4J_APP_PASSWORD:?set NEO4J_APP_PASSWORD in .env}
    volumes:
      - ./queries:/queries:ro
      - ./import:/import:ro
      - ./init.sh:/init.sh:ro
    entrypoint: ["bash", "/init.sh"]

  # Connects with the least-privilege account created by init.sh.
  app:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Published on localhost only, for direct API testing (e.g. Postman).
    # The frontend reaches the API over the internal network.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_APP_USER:-app}
      NEO4J_PASSWORD: ${NEO4J_APP_PASSWORD:?set NEO4J_APP_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "5173:80"
    depends_on:
      - app


volumes:
  neo4j_data:
