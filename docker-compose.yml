services:
  neo4j:
    image: neo4j:2026.07.1-enterprise
    ports:
      - "127.0.0.1:7473:7473"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_http_enabled: "false"
      NEO4J_server_https_enabled: "true"
      NEO4J_server_bolt_tls__level: REQUIRED
      NEO4J_dbms_ssl_policy_bolt_enabled: "true"
      NEO4J_dbms_ssl_policy_bolt_base__directory: /certificates
      NEO4J_dbms_ssl_policy_https_enabled: "true"
      NEO4J_dbms_ssl_policy_https_base__directory: /certificates
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
      - ./import:/import:ro
      # Only Neo4j's own key pair; the keys of the other services stay out of this container.
      - ./certificates/neo4j:/certificates:ro
      - ./certificates/ca.pem:/ca.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --ca-certificate=/ca.pem https://localhost:7473 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  init:
    # The API image: it already has the Neo4j driver, which sends the account name and
    # password as query parameters (see init_db.py).
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt+s://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_APP_USER: ${NEO4J_APP_USER}
      NEO4J_APP_PASSWORD: ${NEO4J_APP_PASSWORD:?set NEO4J_APP_PASSWORD in .env}
      SSL_CERT_FILE: /ca.pem
    volumes:
      - ./queries:/queries:ro
      - ./init_db.py:/init_db.py:ro
      - ./certificates/ca.pem:/ca.pem:ro
    command: ["python", "/init_db.py"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.1
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: usos
      PG_APP_USER: ${PG_APP_USER:-app}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?set PG_APP_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./import:/import:ro
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_import.sql:/docker-entrypoint-initdb.d/02_import.sql:ro
      - ./sql/03_security.sh:/docker-entrypoint-initdb.d/03_security.sh:ro
      - ./sql/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./sql/start.sh:/start.sh:ro
      - ./certificates/postgres:/certs:ro
    # PostgreSQL refuses a private key readable by other users, so start.sh copies
    # the mounted key with mode 600 before handing over to the image's entrypoint.
    entrypoint: ["bash", "/start.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/public.crt
      - -c
      - ssl_key_file=/tmp/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      # TCP only: during initialisation the temporary server listens on the Unix socket alone,
      # so the check passes only after the schema and data have been loaded.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -d usos"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI: bolt+s://neo4j:7687
      NEO4J_USER: ${NEO4J_APP_USER}
      NEO4J_PASSWORD: ${NEO4J_APP_PASSWORD:?set NEO4J_APP_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SSL_CERT_FILE: /ca.pem
      PG_CONNINFO: host=postgres dbname=usos user=${PG_APP_USER:-app} sslmode=verify-full sslrootcert=/ca.pem
      PG_PASSWORD: ${PG_APP_PASSWORD:?set PG_APP_PASSWORD in .env}
    volumes:
      - ./certificates/ca.pem:/ca.pem:ro
      - ./certificates/app:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "127.0.0.1:5173:443"
    volumes:
      - ./certificates/nginx/public.crt:/certificates/public.crt:ro
      - ./certificates/nginx/private.key:/certificates/private.key:ro
      - ./certificates/ca.pem:/certificates/ca.pem:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app

volumes:
  neo4j_data:
  pg_data:
