server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /certificates/public.crt;
    ssl_certificate_key /certificates/private.key;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # The whole API is under /api; every other path is a page of the frontend.
    location /api/ {
        proxy_pass https://app:8000;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certificates/ca.pem;
        proxy_ssl_name app;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in the name, so they never change and can be cached for good.
    # A missing one is a 404: falling back to index.html would hand a stale page HTML instead of JS.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
